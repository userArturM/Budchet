<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Семейный бюджет">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#F4EFE6">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>Семейный бюджет</title>
<style>
:root{--bg:#F4EFE6;--card:#FFFDF8;--tx:#1B1A17;--sub:#8B8578;--line:rgba(27,26,23,.09);--acc:#1F6F5B;--acc2:#E9F1EC;--inc:#1F8A5B;--exp:#D2452E;--bar:rgba(244,239,230,.82);--hero:#16352E;--herotx:#F4EFE6;--sh:0 1px 2px rgba(60,40,10,.05),0 8px 24px rgba(60,40,10,.06);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1412;--card:#18201D;--tx:#F1ECE2;--sub:#8F9A94;--line:rgba(255,255,255,.08);--acc:#58C7A3;--acc2:#1E2D28;--inc:#58C7A3;--exp:#FF7A63;--bar:rgba(15,20,18,.82);--hero:#1F6F5B;--sh:0 8px 24px rgba(0,0,0,.35)}}
:root[data-theme="dark"]{--bg:#0F1412;--card:#18201D;--tx:#F1ECE2;--sub:#8F9A94;--line:rgba(255,255,255,.08);--acc:#58C7A3;--acc2:#1E2D28;--inc:#58C7A3;--exp:#FF7A63;--bar:rgba(15,20,18,.82);--hero:#1F6F5B;--sh:0 8px 24px rgba(0,0,0,.35)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.35 -apple-system,"SF Pro Rounded","SF Pro Text",system-ui,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#app{max-width:520px;margin:0 auto;padding:12px 18px calc(110px + env(safe-area-inset-bottom,0px))}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
h1{font:800 32px/1.1 "New York","Iowan Old Style",Georgia,serif;letter-spacing:-.02em;margin:6px 0 14px}
.sub{color:var(--sub);font-size:13px}
.card{background:var(--card);border-radius:24px;padding:18px;box-shadow:var(--sh);margin-bottom:14px}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.mnav{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.mnav b{font-size:15px;text-transform:capitalize}
.mnav button{width:36px;height:36px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:18px}
.hero{background:var(--hero);color:var(--herotx);border-radius:30px;padding:24px 22px;margin-bottom:14px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-50px;top:-50px;width:190px;height:190px;border-radius:50%;border:34px solid rgba(255,255,255,.06)}
.hero .big{font:800 44px/1.05 "New York",Georgia,serif;letter-spacing:-.03em;margin:6px 0 18px}
.pill{display:flex;gap:10px}.pill div{flex:1;background:rgba(255,255,255,.10);border-radius:16px;padding:10px 12px}
.pill b{display:block;font-size:17px;margin-top:2px}
.ttl{font-weight:700;font-size:17px;margin:0 0 12px}
.ava{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;font-size:21px;flex:none}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.inc{color:var(--inc)}.exp{color:var(--exp)}
.bar{height:8px;border-radius:8px;background:var(--line);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;border-radius:8px;transition:width .5s}
.item{padding:11px 0;border-top:1px solid var(--line)}.item:first-child{border-top:0}
.day{font-size:13px;color:var(--sub);margin:16px 4px 8px;text-transform:capitalize}
.legend{display:grid;gap:7px;font-size:14px}.legend span{display:flex;align-items:center;gap:8px}.legend i{width:10px;height:10px;border-radius:4px;flex:none}
.empty{text-align:center;color:var(--sub);padding:34px 10px}.empty div{font-size:42px;margin-bottom:6px}
.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--bar);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px));z-index:5}
.tabs div{max-width:520px;margin:0 auto;display:flex;align-items:center;justify-content:space-around}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--sub);width:62px;padding:4px 0;font-weight:600}
.tab span{font-size:22px;filter:grayscale(1);opacity:.7}.tab.on{color:var(--acc)}.tab.on span{filter:none;opacity:1}
.fab{width:58px;height:58px;border-radius:20px;background:var(--acc);color:var(--card);font-size:32px;font-weight:300;box-shadow:0 8px 20px rgba(31,111,91,.4);margin-top:-22px;transition:transform .15s}
.fab:active{transform:scale(.92)}
#ov{position:fixed;inset:0;background:rgba(10,12,10,.45);opacity:0;pointer-events:none;transition:opacity .25s;z-index:10}
#ov.on{opacity:1;pointer-events:auto}
#sh{position:fixed;left:0;right:0;bottom:0;max-height:92%;overflow:auto;background:var(--bg);border-radius:28px 28px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.9,.3,1);z-index:11;max-width:520px;margin:0 auto}
#sh.on{transform:none}
.grab{width:40px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 14px}
.seg{display:flex;background:var(--line);border-radius:14px;padding:3px;margin-bottom:14px}
.seg button{flex:1;padding:9px;border-radius:11px;font-weight:600;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--card);color:var(--tx);box-shadow:var(--sh)}
.amin{width:100%;border:0;background:none;font:800 52px/1.1 "New York",Georgia,serif;text-align:center;color:var(--tx);outline:0;margin:2px 0 10px}
.fld{width:100%;border:0;background:var(--card);border-radius:14px;padding:14px;font:inherit;color:var(--tx);outline:0;margin-bottom:10px;box-shadow:var(--sh)}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chip{padding:8px 13px;border-radius:14px;background:var(--card);font-size:14px;font-weight:600;box-shadow:var(--sh);border:2px solid transparent}
.chip.on{border-color:var(--acc);background:var(--acc2)}
.btn{width:100%;padding:16px;border-radius:18px;background:var(--acc);color:var(--card);font-weight:700;font-size:17px;margin-top:4px}
.btn.g{background:var(--card);color:var(--exp);box-shadow:var(--sh)}
.lbl{font-size:13px;color:var(--sub);margin:4px 2px 8px}
.gcard .big{font:800 26px "New York",Georgia,serif}
.sm{padding:7px 14px;border-radius:12px;background:var(--acc2);color:var(--acc);font-weight:700;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:10px;height:112px}.bars div{flex:1;text-align:center;font-size:11px;color:var(--sub);text-transform:capitalize}.bars i{display:block;border-radius:8px 8px 4px 4px;margin-bottom:6px;min-height:3px}
#lk{position:fixed;inset:0;z-index:50;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px}#lk.on{display:flex}.dots{display:flex;gap:14px;margin:18px 0 28px}.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}.dots i.f{background:var(--acc)}.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}.pad button{height:72px;border-radius:50%;background:var(--card);box-shadow:var(--sh);font-size:26px;font-weight:600}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs"><div id="tabs"></div></nav>
<div id="ov" data-a="close"></div><div id="sh"></div><div id="lk"><div style="font-size:42px">🔒</div><div id="lkm" style="font-weight:700;margin-top:8px"></div><div class="dots" id="lkd"></div><div class="pad" id="lkp"></div></div>
<script>
const CATS={"Продукты":["🛒","#2F9E6B"],"Дом":["🏠","#6C5CE7"],"Транспорт":["🚗","#2D7FD6"],"Кафе":["☕","#E58A1F"],"Дети":["🧸","#E5547A"],"Здоровье":["💊","#2BB5C9"],"Досуг":["🎬","#A855D8"],"Прочее":["✨","#8B8578"]};
const INC={"Зарплата":["💼","#1F8A5B"],"Подработка":["💸","#2D7FD6"],"Подарок":["🎁","#E5547A"]};
const MC=["#6C5CE7","#E58A1F","#2F9E6B","#E5547A","#2D7FD6"];
const ci=c=>CATS[c]||INC[c]||(c=="Перевод"?["⇄","#8B8578"]:["✨","#8B8578"]);
const $=s=>document.querySelector(s);
const fm=n=>new Intl.NumberFormat("ru-RU",{maximumFractionDigits:0}).format(Math.round(n))+"\u00A0₽";
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const iso=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
let S,tab="home",off=0,form={},Q="";
function seed(){const t=new Date(),d=t.getDate(),mk=k=>iso(new Date(t.getFullYear(),t.getMonth(),Math.max(1,d-k)));let n=0;const T=(k,type,cat,amount,mem,note)=>({id:"s"+n++,date:mk(k),type,cat,amount,mem,note});
return{members:[{n:"Анна",e:"👩"},{n:"Игорь",e:"👨"},{n:"Миша",e:"🧒"}],
tx:[T(d-1,"inc","Зарплата",92000,0,"Аванс"),T(d-1,"inc","Зарплата",78000,1,"Аванс"),T(0,"exp","Продукты",4820,0,"Магазин у дома"),T(1,"exp","Кафе",1650,1,"Обед с коллегами"),T(2,"exp","Дети",3200,0,"Кружок рисования"),T(2,"exp","Транспорт",2100,1,"Бензин"),T(3,"exp","Продукты",6340,1,"Рынок"),T(4,"exp","Дом",12800,0,"Коммуналка"),T(5,"exp","Досуг",2400,2,"Кино всей семьёй"),T(6,"exp","Здоровье",1900,0,"Аптека")],
limits:{"Продукты":30000,"Дом":25000,"Транспорт":8000,"Кафе":7000,"Дети":10000,"Здоровье":6000,"Досуг":8000,"Прочее":5000},
goals:[{n:"Отпуск на море",e:"🏖️",t:180000,s:74000},{n:"Новый ноутбук",e:"💻",t:90000,s:32000}]}}
function load(){try{const r=localStorage.getItem("fbudget2");if(r)return JSON.parse(r)}catch(e){}return seed()}
function save(){lsSave();push()}
function lsSave(){try{localStorage.setItem("fbudget2",JSON.stringify(S))}catch(e){}}
S=load();S.rec=S.rec||[];S.cats=S.cats||{};S.accs=S.accs||[{n:"Карта",e:"💳",b:0},{n:"Наличные",e:"💵",b:0}];S.debts=S.debts||[];S.kids=S.kids||[];Object.assign(CATS,S.cats);applyRec();
function applyRec(){let ch=0;const now=new Date(),cur=now.getFullYear()*12+now.getMonth();S.rec.forEach(r=>{let m=r.last;while(m<cur){m++;const d=new Date(Math.floor(m/12),m%12,r.day);if(d<=now){S.tx.push({id:"r"+r.id+"_"+m,date:iso(d),type:r.type,cat:r.cat,amount:r.amount,mem:r.mem,note:r.note||r.cat});ch=1}else{m--;break}}r.last=m});S.kids.forEach(k=>{while(k.allow&&k.last<cur){k.last++;k.bal+=k.allow;ch=1}});if(ch)save()}
const mon=()=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+off);return d};
const mkey=()=>iso(mon()).slice(0,7);
const mtx=()=>S.tx.filter(t=>t.date.startsWith(mkey())).sort((a,b)=>b.date.localeCompare(a.date)||0);
const sum=(a,f)=>a.filter(f).reduce((s,t)=>s+t.amount,0);
const buzz=()=>{try{navigator.vibrate&&navigator.vibrate(8)}catch(e){}};

function donut(data,total){const C=2*Math.PI*52;let o=0;let s='<svg viewBox="0 0 140 140" width="132" height="132"><circle cx="70" cy="70" r="52" fill="none" stroke="var(--line)" stroke-width="15"/>';
data.forEach(([c,v])=>{const l=v/total*C;s+=`<circle cx="70" cy="70" r="52" fill="none" stroke="${ci(c)[1]}" stroke-width="15" stroke-dasharray="${Math.max(l-3,.5)} ${C}" stroke-dashoffset="${-o}" transform="rotate(-90 70 70)" stroke-linecap="round"/>`;o+=l});
return s+`<text x="70" y="66" text-anchor="middle" font-size="11" fill="var(--sub)">расходы</text><text x="70" y="84" text-anchor="middle" font-size="15" font-weight="800" fill="var(--tx)">${fm(total)}</text></svg>`}

function txRow(t){const [e,c]=ci(t.cat),m=S.members[t.mem]||{n:"—"};
return `<button class="row item" style="width:100%;text-align:left" data-a="tx" data-id="${t.id}"><div class="ava" style="background:${c}22">${e}</div><div class="sp"><b>${esc(t.note||t.cat)}</b><div class="sub">${esc(t.cat)} · ${esc(m.n)}</div></div><div class="amt ${t.type}">${t.type=="inc"?"+":t.type=="exp"?"−":"⇄ "}${fm(t.amount)}</div></button>`}

const V={
home(){const a=mtx(),inc=sum(a,t=>t.type=="inc"),exp=sum(a,t=>t.type=="exp"),bal=inc-exp;
const by={};a.filter(t=>t.type=="exp").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);const dat=Object.entries(by).sort((x,y)=>y[1]-x[1]);
const mm={};a.filter(t=>t.type=="exp").forEach(t=>mm[t.mem]=(mm[t.mem]||0)+t.amount);
let h=`<h1>Семья</h1>${nav()}<div class="hero"><div style="opacity:.7;font-size:14px">Остаток за месяц</div><div class="big">${fm(bal)}</div><div class="pill"><div><span style="opacity:.7;font-size:12px">Доходы</span><b>+${fm(inc)}</b></div><div><span style="opacity:.7;font-size:12px">Расходы</span><b>−${fm(exp)}</b></div></div></div>`;
{const bl=S.accs.map((x,i)=>x.b+sum(S.tx,t=>(t.acc||0)==i&&t.type=="inc")-sum(S.tx,t=>(t.acc||0)==i&&t.type=="exp")+sum(S.tx,t=>t.type=="trf"&&t.to==i)-sum(S.tx,t=>t.type=="trf"&&t.acc==i));h+=`<div class="card"><div class="row" style="margin-bottom:6px"><p class="ttl sp" style="margin:0">Счета</p><b class="amt">${fm(bl.reduce((s,v)=>s+v,0))}</b></div>${S.accs.map((x,i)=>`<div class="row item"><div class="ava" style="background:var(--acc2);width:36px;height:36px;font-size:18px">${x.e}</div><b class="sp">${esc(x.n)}</b><span class="amt">${fm(bl[i])}</span></div>`).join("")}<button class="sm" style="margin-top:10px" data-a="adda">+ Счёт</button><button class="sm" style="margin:10px 0 0 8px" data-a="trf">⇄ Перевод</button></div>`}
if(off==0){const n=new Date(),t0=new Date(n.getFullYear(),n.getMonth(),n.getDate()),up=S.rec.filter(r=>r.type=="exp").map(r=>{let d=new Date(n.getFullYear(),n.getMonth(),r.day);if(d<t0)d=new Date(n.getFullYear(),n.getMonth()+1,r.day);return[r,Math.round((d-t0)/864e5)]}).filter(x=>x[1]>0&&x[1]<=7).sort((p,q)=>p[1]-q[1]);if(up.length)h+=`<div class="card"><p class="ttl">Скоро спишется</p>${up.map(([r,k])=>`<div class="row item"><div class="ava" style="background:${ci(r.cat)[1]}22;width:36px;height:36px;font-size:18px">${ci(r.cat)[0]}</div><div class="sp"><b>${esc(r.note||r.cat)}</b><div class="sub">${k==1?"завтра":"через "+k+" дн."}</div></div><span class="amt exp">${fm(r.amount)}</span></div>`).join("")}</div>`}
if(off==0&&exp>0){const n=new Date(),dm=new Date(n.getFullYear(),n.getMonth()+1,0).getDate(),pr=exp/n.getDate()*dm,pk=iso(new Date(n.getFullYear(),n.getMonth()-1,1)).slice(0,7),pe=sum(S.tx,t=>t.type=="exp"&&t.date.startsWith(pk));h+=`<div class="card"><p class="ttl">Прогноз на месяц</p><div>При текущем темпе к концу месяца вы потратите около <b>${fm(pr)}</b>${inc?`, и останется <b class="${inc-pr<0?"exp":"inc"}">${fm(inc-pr)}</b>`:""}.</div>${pe?`<div class="sub" style="margin-top:6px">В прошлом месяце потратили ${fm(pe)}</div>`:""}</div>`}
if(inc>0){const NE=["Продукты","Дом","Транспорт","Здоровье","Дети"],nd=sum(a,t=>t.type=="exp"&&NE.includes(t.cat)),R=[["Обязательное",50,nd,"#2F9E6B"],["Желания",30,exp-nd,"#E58A1F"],["Накопления",20,Math.max(inc-exp,0),"#6C5CE7"]];h+=`<div class="card"><p class="ttl">План 50 / 30 / 20</p><div class="sub" style="margin:-6px 0 10px">Обязательное — до 50% дохода, желания — до 30%, накопления — от 20%</div>${R.map(([n,p,v,c],i)=>{const tg=inc*p/100,over=i<2&&v>tg;return `<div style="margin-bottom:12px"><div class="row"><b class="sp">${n}</b><span class="amt ${over?"exp":""}" style="font-size:14px">${fm(v)} <span class="sub">из ${fm(tg)}</span></span></div><div class="bar"><i style="width:${Math.min(v/tg,1)*100}%;background:${over?"var(--exp)":c}"></i></div></div>`}).join("")}</div>`}
if(!a.length)return h+`<div class="card empty"><div>🌱</div>В этом месяце пока тихо.<br>Нажмите «+», чтобы добавить первую операцию.</div>`;
if(exp)h+=`<div class="card"><p class="ttl">Куда уходят деньги</p><div class="row"><div>${donut(dat,exp)}</div><div class="legend sp">${dat.slice(0,5).map(([c,v])=>`<span><i style="background:${ci(c)[1]}"></i><span class="sp">${c}</span><b>${Math.round(v/exp*100)}%</b></span>`).join("")}</div></div></div>`;
{const ms=[];for(let i=5;i>=0;i--){const d=mon();d.setMonth(d.getMonth()-i);const k=iso(d).slice(0,7);ms.push([d.toLocaleDateString("ru-RU",{month:"short"}),sum(S.tx,t=>t.type=="exp"&&t.date.startsWith(k))])}const mx=Math.max(...ms.map(x=>x[1]),1);h+=`<div class="card"><p class="ttl">Расходы за 6 месяцев</p><div class="bars">${ms.map((x,i)=>`<div><i style="height:${x[1]/mx*80}px;background:${i==5?"var(--acc)":"var(--line)"}"></i>${x[0]}</div>`).join("")}</div></div>`}
if(exp)h+=`<div class="card"><p class="ttl">Кто сколько потратил</p>${S.members.map((m,i)=>`<div style="margin-bottom:12px"><div class="row"><div class="ava" style="background:${MC[i%5]}22;width:34px;height:34px;font-size:18px">${m.e}</div><b class="sp">${esc(m.n)}</b><span class="amt">${fm(mm[i]||0)}</span></div><div class="bar"><i style="width:${(mm[i]||0)/exp*100}%;background:${MC[i%5]}"></i></div></div>`).join("")}<button class="sm" data-a="addm">+ Участник</button></div>`;
h+=`<div class="card"><p class="ttl">Последнее</p>${a.slice(0,4).map(txRow).join("")}</div>`;return h},
list(){const a=mtx().filter(t=>!Q||(t.cat+" "+(t.note||"")).toLowerCase().includes(Q));let h=`<h1>Операции</h1>${nav()}<input class="fld" id="q" placeholder="Поиск по операциям" value="${esc(Q)}" oninput="Q=this.value.toLowerCase();clearTimeout(window._qt);window._qt=setTimeout(()=>{render();const e=$('#q');e.focus();e.setSelectionRange(99,99)},250)">`;if(!a.length)return h+`<div class="card empty"><div>🧾</div>Операций нет.<br>Добавьте первую кнопкой «+».</div>`;
const g={};a.forEach(t=>(g[t.date]=g[t.date]||[]).push(t));const td=iso(new Date()),yd=iso(new Date(Date.now()-864e5));
Object.keys(g).sort().reverse().forEach(d=>{const lb=d==td?"Сегодня":d==yd?"Вчера":new Date(d+"T12:00").toLocaleDateString("ru-RU",{weekday:"short",day:"numeric",month:"long"});
const dsum=g[d].reduce((s,t)=>s+(t.type=="inc"?t.amount:t.type=="exp"?-t.amount:0),0);
h+=`<div class="row day"><span class="sp">${lb}</span><span>${dsum>0?"+":"−"}${fm(Math.abs(dsum))}</span></div><div class="card" style="padding:4px 16px">${g[d].map(txRow).join("")}</div>`});return h},
limits(){const a=mtx();let h=`<h1>Лимиты</h1>${nav()}<p class="sub" style="margin:-4px 4px 12px">Нажмите на категорию, чтобы изменить лимит</p><div class="card" style="padding:6px 16px">`;

kid(t){form={s:+t.dataset.s};open(`<p class="ttl" style="text-align:center">${form.s>0?"Сколько выдать?":"Сколько потратил?"}</p><input id="kv" class="amin" inputmode="decimal" placeholder="0 ₽"><button class="btn" data-a="savekid" data-id="${t.dataset.id}">Готово</button>`);setTimeout(()=>$("#kv").focus(),350)},
savekid(t){const k=S.kids.find(x=>x.id==t.dataset.id),v=num($("#kv").value);if(!k||v<=0)return;k.bal=Math.max(k.bal+form.s*v,0);save();buzz();close();render()},
async scan(inp){const f=inp.files[0],m=$("#sm");window._nl=0;if(!f)return;m.textContent="Читаю чек…";try{const s=await claude.use("sample");if(!s){m.textContent="Сканирование недоступно в этом режиме";return}const r=await s.json(`На фото чек. Верни только JSON вида {"amount":итоговая сумма числом,"category":одна из [${Object.keys(CATS).join(", ")}],"note":"магазин или кратко что куплено","date":"YYYY-MM-DD или null"}`,{images:[await shrink(f)]});if(!r||!(r.amount>0)){m.textContent="Не удалось распознать сумму";return}$("#am").value=r.amount;if(form.type=="exp"&&CATS[r.category]){form.cat=r.category;$("#cats").innerHTML=catsHTML()}$("#nt").value=r.note||"";if(/^\d{4}-\d\d-\d\d$/.test(r.date||""))$("#dt").value=r.date;m.textContent="Проверьте данные и сохраните"}catch(e){m.textContent="Не получилось прочитать чек"}},
key(t){const k=t.dataset.k;if(k=="x")pin=pin.slice(0,-1);else if(pin.length<4)pin+=k;dots();if(pin.length==4)setTimeout(done,120)},
kx(){$("#lk").classList.remove("on")},
pinset(){open(`<p class="ttl">PIN-код</p><p class="sub" style="margin-bottom:12px">Приложение будет запрашивать код при каждом открытии. Это защита от случайного взгляда, а не шифрование данных.</p><button class="btn" style="margin-bottom:10px" data-a="pinon">${getPin()?"Сменить PIN":"Включить PIN"}</button>${getPin()?`<button class="btn g" data-a="pinoff">Отключить PIN</button>`:""}`)},
pinon(){close();lock("set","Придумайте PIN из 4 цифр")},
pinoff(){try{localStorage.removeItem("fbpin")}catch(e){}close();render()},
async report(){const a=mtx(),inc=sum(a,t=>t.type=="inc"),exp=sum(a,t=>t.type=="exp"),by={};a.filter(t=>t.type=="exp").forEach(t=>by[t.cat]=(by[t.cat]||0)+t.amount);const mt=mon().toLocaleDateString("ru-RU",{month:"long",year:"numeric"});
const rows=Object.entries(by).sort((x,y)=>y[1]-x[1]).map(([c,v])=>`<tr><td>${ci(c)[0]} ${esc(c)}</td><td>${fm(v)}</td><td>${S.limits[c]?fm(S.limits[c]):"—"}</td><td>${Math.round(v/exp*100)}%</td></tr>`).join("");
const mem=S.members.map((m,i)=>`<tr><td>${m.e} ${esc(m.n)}</td><td>${fm(sum(a,t=>t.type=="exp"&&t.mem==i))}</td></tr>`).join("");
const html=`<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Отчёт ${mt}</title><style>body{font:16px/1.4 -apple-system,Georgia,serif;max-width:640px;margin:0 auto;padding:24px;color:#1B1A17}h1{font-size:28px;margin:0}h2{margin:26px 0 8px;font-size:18px}table{width:100%;border-collapse:collapse}td,th{padding:8px 4px;border-bottom:1px solid #ddd;text-align:left}td+td,th+th{text-align:right}.k{display:flex;gap:12px;margin-top:14px}.k div{flex:1;background:#F4EFE6;border-radius:14px;padding:12px;font-size:13px}.k b{display:block;font-size:19px}</style><h1>Семейный бюджет: ${mt}</h1><div class="k"><div>Доходы<b>${fm(inc)}</b></div><div>Расходы<b>${fm(exp)}</b></div><div>Остаток<b>${fm(inc-exp)}</b></div></div><h2>Расходы по категориям</h2><table><tr><th>Категория</th><th>Потрачено</th><th>Лимит</th><th>Доля</th></tr>${rows}</table><h2>По членам семьи</h2><table>${mem}</table><h2>Цели</h2><table>${S.goals.map(g=>`<tr><td>${g.e} ${esc(g.n)}</td><td>${fm(g.s)} из ${fm(g.t)}</td></tr>`).join("")||"<tr><td>—</td></tr>"}</table><h2>Кредиты</h2><table>${S.debts.map(d=>`<tr><td>${esc(d.n)}</td><td>осталось ${fm(Math.max(d.total-d.paid,0))}</td></tr>`).join("")||"<tr><td>—</td></tr>"}</table></html>`;
try{const d=window.claude?await claude.use("downloads"):{save:dlsave};if(d){await d.save({filename:"otchet-"+mkey()+".html",data:html});return}}catch(e){}
open(`<p class="ttl">Экспорт недоступен</p><p class="sub" style="margin-bottom:12px">Откройте приложение по ссылке в Safari и повторите.</p><button class="btn" data-a="close">Понятно</button>`)},
reset(){open(`<p class="ttl" style="text-align:center">Удалить все данные?</p><p class="sub" style="text-align:center">Операции, лимиты и цели будут стёрты без возможности восстановления.</p><button class="btn g" data-a="reset2">Да, удалить</button><button class="btn" data-a="close">Отмена</button>`)},
reset2(){S={members:[{n:"Я",e:"🙂"}],tx:[],rec:[],cats:{},debts:[],kids:[],accs:[{n:"Карта",e:"💳",b:0},{n:"Наличные",e:"💵",b:0}],limits:{"Продукты":0,"Дом":0,"Транспорт":0,"Кафе":0,"Дети":0,"Здоровье":0,"Досуг":0,"Прочее":0},goals:[]};save();close();tab="home";render()}};
document.addEventListener("click",e=>{const t=e.target.closest("[data-a]");if(t&&A[t.dataset.a])A[t.dataset.a](t)});
const ph=p=>{let h=5381;for(const c of "fb:"+p)h=(h*33+c.charCodeAt(0))>>>0;return String(h)};
let pin="",ptmp="",lkMode="";
function getPin(){try{return localStorage.getItem("fbpin")||""}catch(e){return""}}
function dots(){$("#lkd").innerHTML=[0,1,2,3].map(i=>`<i class="${i<pin.length?"f":""}"></i>`).join("")}
function lock(mode,msg){lkMode=mode;pin="";$("#lk").classList.add("on");$("#lkm").textContent=msg;$("#lkp").innerHTML=[1,2,3,4,5,6,7,8,9].map(n=>`<button data-a="key" data-k="${n}">${n}</button>`).join("")+`<button data-a="kx" style="font-size:14px;visibility:${mode=="unlock"?"hidden":"visible"}">Отмена</button><button data-a="key" data-k="0">0</button><button data-a="key" data-k="x">⌫</button>`;dots()}
function done(){if(lkMode=="unlock"){if(ph(pin)==getPin())$("#lk").classList.remove("on");else lock("unlock","Неверный PIN, попробуйте ещё")}else if(lkMode=="set"){ptmp=pin;lock("set2","Повторите PIN")}else if(pin==ptmp){try{localStorage.setItem("fbpin",ph(pin))}catch(e){}$("#lk").classList.remove("on");render()}else lock("set","PIN не совпал, начните заново")}
function shrink(f){return new Promise(res=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement("canvas");c.width=i.width*k;c.height=i.height*k;c.getContext("2d").drawImage(i,0,0,c.width,c.height);c.toBlob(res,"image/jpeg",.8)};i.src=URL.createObjectURL(f)})}
document.addEventListener("visibilitychange",()=>{if(document.hidden&&getPin()&&!window._nl)lock("unlock","Введите PIN")});
let rf=null,own=0,pt;
function fix(){S.rec=S.rec||[];S.cats=S.cats||{};S.accs=S.accs||[{n:"Карта",e:"💳",b:0}];S.debts=S.debts||[];S.kids=S.kids||[];S.limits=S.limits||{};S.goals=S.goals||[];Object.assign(CATS,S.cats)}
function push(){if(!rf)return;clearTimeout(pt);pt=setTimeout(async()=>{own=Date.now();try{await rf.set({json:JSON.stringify(S),ts:own})}catch(e){}},600)}
async function initSync(){try{const db=await claude.use("db");if(!db)return;const r=db.doc("family/budget");r.onSnapshot(s=>{if(s.metadata&&s.metadata.hasPendingWrites)return;const d=s.exists&&s.data();if(!d||!d.json||d.ts<=own)return;try{S=JSON.parse(d.json);fix();own=d.ts;lsSave();render()}catch(e){}},()=>{});const s=await r.get();rf=r;if(!s.exists)push();else if(s.data().ts>own){S=JSON.parse(s.data().json);fix();own=s.data().ts;lsSave();render()}else render()}catch(e){}}
render();if(getPin())lock("unlock","Введите PIN");initSync();
function dlsave({filename,data}){const b=new Blob([data],{type:filename.endsWith(".csv")?"text/csv;charset=utf-8":"text/html;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>a.remove(),500)}
if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script>
